syntax = "proto3";

package urlshortener.v1;

option go_package = "url-shortener/api/urlshortener/v1;v1";

service UrlShortener {
  rpc Shorten (ShortenRequest) returns (ShortenReply);
  rpc Resolve (ResolveRequest) returns (ResolveReply);
}

message ShortenRequest {
  string long_url = 1;
}

message ShortenReply {
  string short_url = 1;
  int64 expires_at = 2; // Unix timestamp when the URL expires
}

message ResolveRequest {
  string short_code = 1;
}

message ResolveReply {
  string long_url = 1;
  int64 expires_at = 2; // Unix timestamp when the URL expires
}

message Server {
  message HTTP {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }
  message GRPC {
    string network = 1;
    string addr = 2;
    int64 timeout = 3;
  }
  HTTP http = 1;
  GRPC grpc = 2;
  string domain = 3;
  int64 default_expiry_hours = 4; // Default expiry time in hours (24 hours by default)
}
